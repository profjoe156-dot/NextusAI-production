[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusai-bot"
version = "1.0.0"
description = "Production-ready Telegram AI platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Manus AI"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "python-telegram-bot>=22.0,<23.0",
  "openai>=1.75,<2.0",
  "sqlalchemy[asyncio]>=2.0.40,<3.0",
  "asyncpg>=0.30,<1.0",
  "redis>=5.2,<7.0",
  "alembic>=1.15,<2.0",
  "pydantic-settings>=2.8,<3.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "itsdangerous>=2.2,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "httpx>=0.28,<1.0",
  "tenacity>=9.0,<10.0",
  "apscheduler>=3.11,<4.0",
  "feedparser>=6.0,<7.0",
  "prometheus-client>=0.21,<1.0",
  "email-validator>=2.2,<3.0",
  "greenlet>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.26,<1.0",
  "pytest-cov>=6.1,<7.0",
  "ruff>=0.11,<1.0",
  "mypy>=1.15,<2.0",
  "aiosqlite>=0.21,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
